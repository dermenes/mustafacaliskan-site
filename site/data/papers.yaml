- title: How Does Work from Home Affect Mothers' Labor Supply During Summer School Closures?
  authors:
  - Mustafa Enes Çalışkan
  year: 2026
  status: working paper
  venue: ''
  pdf: https://drive.google.com/file/d/14D3Mo0b9reGN7p7C1S4aXUSCLuMtJSe1/view?usp=drive_link
  link: ''
  abstract: Each summer, school closures increase childcare demand and contribute to a seasonal decline
    in mothers' labor force participation. This paper asks whether access to work from home mitigates
    this decline. Using monthly Current Population Survey data from 2022 to 2025, I estimate an event
    study comparing mothers whose youngest child is aged 6 to 12, with and without access to work from
    home, including person, year-month, and occupation-by-month fixed effects. In July, mothers with access
    to work from home are 2.6 percentage points more likely to be employed than mothers who work exclusively
    onsite. The difference is absent outside the summer, emerges in June, closes by August, and tracks
    state school calendars. The July employment gap reflects labor force exits for childcare rather than
    unemployment. I find no effect on hours among employed mothers, although mothers with access to work
    from home are less likely to take a week-long paid absence. No comparable response appears among fathers
    or women without children. These findings suggest that access to work from home helps mothers stay
    in the labor force when summer childcare demands increase.
  job_market_paper: true
